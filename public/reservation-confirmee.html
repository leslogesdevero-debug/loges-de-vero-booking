<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<title>Réservation confirmée — Les Loges de Véro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  body{margin:0; background:#F6F3EC; color:#2A2926; font-family:'Work Sans',sans-serif; padding:60px 20px; text-align:center;}
  .card{max-width:520px; margin:0 auto; background:#fff; border:1px solid #DED7C6; border-radius:8px; padding:40px 30px;}
  .icon{font-size:40px; margin-bottom:10px;}

<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Votre réservation est confirmée</h1>

    <p>À très bientôt à Verdun !</p>
  </div>
